# The job array's crack1 config, for the crack1 milestone and production (HF-057, OR-047): the 35-key incidence grid
# of OR-036, theta 90 to 180 deg in 15 deg steps and phi 0 to 90 deg in 22.5 deg steps, both in the crack-local frame.
# It is crack1_500GHz_grid35.toml with two changes only: no solver.frequency_ghz, because the plan supplies each
# task's frequency (and any exit resolution along l, OR-037), and [acceptance] kind = "array_run", each task's own
# check against its frozen plan, which takes no reference job. Schema 2: a plan running it names the HF-041
# column-order reference explicitly.

[project]
path = "/home/rshenoy/BBRSim/projects/ParallelPlateGaps.aedt"
design = "parallel_plate_gap_50um"
dataset_id = "InfParallelPlate_crack1Rohan"
aedt_version = "2025.2"

[geometry]
object = "gap"
entrance_face = { axis = "z", side = "min" }   # legacy face ID 8, plane wave origin (0.025, 0, 0) mm
exit_face = { axis = "z", side = "max" }       # legacy face ID 7
exit_cs_x = [0.0, 0.0, 1.0]
exit_cs_y = [0.0, 1.0, 0.0]
expected_box_size_mm = [0.05, 10.0, 1.0]
expected_face_area_mm2 = 0.5
symmetry = ["mirror_l", "mirror_g", "end_to_end"]

[excitation]
ei_v_per_m = 1.0
theta_lower_deg = 90.0
theta_upper_deg = 180.0
theta_step_deg = 15.0
phi_lower_deg = 0.0
phi_upper_deg = 90.0
phi_step_deg = 22.5

[solver]
max_delta_e = 0.005
max_passes = 20
cores = 4
sweep = "discrete"

[far_field]
theta_lower_deg = 0.0
theta_upper_deg = 180.0
phi_lower_deg = -90.0
phi_upper_deg = 90.0
a_mm = 10.0
b_mm = 0.05
fineness = 10.0
min_coarseness_deg = 0.1
max_coarseness_deg = 5.0

[exit_field]
manual = true
resolution_mm = [0.0, 0.1, 0.001]

[output]
root = "/home/rshenoy/BBRSim/outputs"
polarizations = [0, 1]
export_timeout_s = 300.0
schema = 2

[acceptance]
kind = "array_run"
