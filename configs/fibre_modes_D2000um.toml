# Ports-only mode study of the 2000 um silver bore (ledger OR-053): vacuum cylinder, wave ports on both end faces,
# bulk finite-conductivity wall, 25 modes per port, AEDT 2025 R2's cap for a wave port (OR-053). Every frequency
# lies at least 2 % from every ideal cutoff, and at most 21 modes propagate at any of them.

[project]
geometry_spec = "geometries/fibre_bore_D2000um.toml"

[wall]
kind = "finite_conductivity"
conductivity_s_per_m = 6.29e7

[ports]
modes = 25
frequencies_ghz = [92, 100, 105, 129, 163, 191, 222, 283, 313]

[solver]
cores = 4
curvilinear = true
wall_normal_deviation_deg = 5.0
port_accuracy_percent = 1
port_face_max_length_mm = 0.0348

[output]
root = "/home/rshenoy/BBRSim/outputs"
