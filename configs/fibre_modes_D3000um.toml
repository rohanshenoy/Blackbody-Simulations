# Ports-only mode study of the 3000 um silver bore (ledger OR-053): vacuum cylinder, wave ports on both end faces,
# bulk finite-conductivity wall, 47 modes per port. Every frequency lies at least 2 % from every ideal cutoff.

[project]
geometry_spec = "geometries/fibre_bore_D3000um.toml"

[wall]
kind = "finite_conductivity"
conductivity_s_per_m = 6.29e7

[ports]
modes = 47
frequencies_ghz = [61, 67, 70, 86, 109, 128, 148, 189, 209, 218, 231, 248, 261, 287]

[solver]
cores = 4
curvilinear = true
wall_normal_deviation_deg = 5.0
port_accuracy_percent = 1
port_face_max_length_mm = 0.0522

[output]
root = "/home/rshenoy/BBRSim/outputs"
