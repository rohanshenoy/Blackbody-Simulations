# The 35-key incidence grid of OR-036 (Rohan, 2026-10-19) for the round gap at 2000 GHz, HPC step 10: theta 90 to 180
# deg in 15 deg steps and phi 0 to 90 deg in 22.5 deg steps, both in the crack-local frame, so every key is reachable.
# Derived from round_gap_r50um_2000GHz_reference.toml (MaxDeltaE 0.005, up to 20 passes, 5 deg wall facets): only
# those six [excitation] lines, schema = 2 in [output] and the [acceptance] table differ (tests/test_config.py pins
# that). Run it with --column-order-reference, the file crack1's 35-key job keeps as
# scratch/column_order_reference.json (HF-041).

[project]
path = "/home/rshenoy/BBRSim/projects/RoundGap.aedt"
design = "round_gap_r50um"
dataset_id = "RoundGap_r50um"
aedt_version = "2025.2"

[geometry]
object = "gap"
entrance_face = { axis = "z", side = "min" }
exit_face = { axis = "z", side = "max" }
exit_cs_x = [0.0, 0.0, 1.0]
exit_cs_y = [0.0, 1.0, 0.0]
expected_box_size_mm = [0.1, 0.1, 0.4]
expected_face_area_mm2 = 0.007853982
pose = "canonical-z"
symmetry = ["rotational", "mirror_l", "mirror_g", "end_to_end"]

[excitation]
ei_v_per_m = 1.0
theta_lower_deg = 90.0
theta_upper_deg = 180.0
theta_step_deg = 15.0
phi_lower_deg = 0.0
phi_upper_deg = 90.0
phi_step_deg = 22.5

[solver]
frequency_ghz = 2000
max_delta_e = 0.005  # Rohan 2026-10-06 (HF-027): production target; was 0.02
max_passes = 20
wall_normal_deviation_deg = 5.0  # Rohan 2026-10-07 (HF-032): HFSS's default facets put T 7.0 % low (step 7b)
cores = 4
sweep = "discrete"

[far_field]
theta_lower_deg = 0.0
theta_upper_deg = 180.0
phi_lower_deg = -90.0
phi_upper_deg = 90.0
a_mm = 0.1
b_mm = 0.1
fineness = 10.0
min_coarseness_deg = 0.1
max_coarseness_deg = 5.0

[exit_field]
manual = true
resolution_mm = [0.0, 0.001, 0.001]
edge_samples = 64

[output]
root = "/home/rshenoy/BBRSim/outputs"
polarizations = [0, 1]
export_timeout_s = 300.0
schema = 2

[acceptance]
kind = "grid_acceptance"
reference_job = "/home/rshenoy/BBRSim/outputs/RoundGap_r50um_2000GHz/job_reference1"
